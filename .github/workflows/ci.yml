name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and package
        run: >-
          ./mvnw -B -ntp verify
          -Dspring.datasource.url=jdbc:h2:mem:ci
          -Dspring.datasource.driver-class-name=org.h2.Driver
          -Dspring.jpa.database-platform=org.hibernate.dialect.H2Dialect
          -Dspring.jpa.hibernate.ddl-auto=create-drop
          -Djwt.secret=ci-only-secret-at-least-32-bytes-long
      - name: Verify API examples
        shell: bash
        run: |
          java -jar target/taskManager-0.0.1-SNAPSHOT.jar \
            --server.port=18080 \
            --spring.datasource.url=jdbc:h2:mem:api-ci \
            --spring.datasource.driver-class-name=org.h2.Driver \
            --spring.jpa.database-platform=org.hibernate.dialect.H2Dialect \
            --spring.jpa.hibernate.ddl-auto=create-drop \
            --jwt.secret=ci-only-secret-at-least-32-bytes-long > /tmp/api-ci.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/tasks)" = 401 ]; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/api-ci.log; exit 1; fi
          BASE_URL=http://localhost:18080 bash scripts/api-example.sh
      - name: Build Docker image
        run: docker build --tag task-manager:ci .
