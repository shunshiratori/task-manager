services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: taskmanager
      MYSQL_USER: taskapp
      MYSQL_PASSWORD: ${COMPOSE_DB_PASSWORD:-local-taskapp-password}
      MYSQL_ROOT_PASSWORD: ${COMPOSE_DB_ROOT_PASSWORD:-local-root-password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e 'SELECT 1' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: taskmanager
      DB_USER: taskapp
      DB_PASSWORD: ${COMPOSE_DB_PASSWORD:-local-taskapp-password}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 UTF-8 bytes)}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/tasks)" = 401
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
volumes:
  mysql-data:
